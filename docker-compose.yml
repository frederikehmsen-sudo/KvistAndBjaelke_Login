services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/app.db"
    volumes:
      - appdata:/app/data

  frontend:
    build: ./client        
    ports:
      - "8081:3000"
    depends_on:
      - backend

volumes:
  appdata: